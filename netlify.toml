[build]
command = "npm run build"
publish = "build/client"
node_bundler = "esbuild"

[build.environment]
NODE_VERSION = "20.5.0"
NPM_VERSION = "10.2.5"

[dev]
command = "npm run dev"
framework = "vite"

# Set immutable caching for static files, because they have fingerprinted filenames

[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31560000, immutable"

[functions]
node_bundler = "esbuild"
